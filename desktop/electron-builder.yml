appId: com.senavoz.app
productName: SeñaVoz
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
# synth.ps1 se ejecuta con powershell.exe: debe quedar fuera del asar.
extraResources:
  - from: resources/tts
    to: tts
win:
  target: nsis
  icon: resources/icon.png
  executableName: SenaVoz
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: SenaVoz-Setup-${version}.${ext}
  shortcutName: SeñaVoz
  uninstallDisplayName: SeñaVoz
npmRebuild: false
