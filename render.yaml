# Blueprint de Render: API de SeñaVoz (spec docs/superpowers/specs/2026-10-23-backend-deploy-design.md).
# La base de datos vive en Neon; su URL se pega en Render al crear el Blueprint y no se versiona.
services:
  - type: web
    name: senavoz-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    # Solo los cambios en backend/ redespliegan; rutas de Docker relativas a la raíz del repo.
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Despliega cada commit de main solo si pasan los checks de GitHub Actions (ci.yml).
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: app://senavoz
      # Render es el único camino de entrada: se acepta su X-Forwarded-For (límite por IP real).
      - key: FORWARDED_ALLOW_IPS
        value: '*'
